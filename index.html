<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Moje knihovna</title>
<meta name="apple-mobile-web-app-title" content="Moje knihy">
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#1c2230;--mute:#6b7280;--line:#e2dfd8;--acc:#2c5f7c;--accink:#fff;--danger:#b4402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181f;--card:#1f2430;--ink:#eceae4;--mute:#9aa1ad;--line:#2f3542;--acc:#6fb0d2;--accink:#10202b;--danger:#e0806f}}
:root[data-theme="dark"]{--bg:#15181f;--card:#1f2430;--ink:#eceae4;--mute:#9aa1ad;--line:#2f3542;--acc:#6fb0d2;--accink:#10202b;--danger:#e0806f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 110px}
h1{font:600 30px/1.1 Georgia,"Times New Roman",serif;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 14px}
input,select,textarea,button{font:inherit;color:inherit}
.field{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.field:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.book{display:flex;gap:12px;align-items:stretch;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;margin-top:10px;cursor:pointer;overflow:hidden}
.spine{width:12px;flex:none}
.bb{padding:11px 12px 11px 0;min-width:0}
.t{font:600 17px/1.25 Georgia,"Times New Roman",serif}
.a{color:var(--mute);font-size:14px}
.meta{margin-top:6px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--mute)}
.loan{color:var(--danger)}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.add{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--accink);border:0;border-radius:999px;padding:14px 26px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.link{background:none;border:0;color:var(--acc);padding:10px 0;cursor:pointer;text-decoration:underline}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.shade.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:600 22px Georgia,serif;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:28px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.stars button.on{color:#d49b1f}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.btn.d{color:var(--danger)}
textarea.field{min-height:84px;resize:vertical}
.msg{font-size:14px;color:var(--mute);margin-top:8px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Moje knihovna</h1>
  <p class="sub" id="count"></p>
  <input id="q" class="field" type="search" placeholder="Hledat název, autora, ISBN nebo poznámku" aria-label="Hledat">
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <button class="link" id="bk">Záloha a obnovení</button>
</div>
<button class="add" id="addb">Přidat knihu</button>

<div class="shade" id="sh1"><div class="sheet" role="dialog" aria-label="Kniha">
  <h2 id="ft">Nová kniha</h2>
  <label for="f-i">ISBN</label><input id="f-i" class="field" inputmode="numeric" placeholder="např. 9788025737439">
  <button type="button" class="btn" id="sc" style="margin-top:8px;width:100%">Naskenovat čárový kód</button>
  <div id="scw" style="display:none;margin-top:8px"><div id="reader"></div><button type="button" class="btn" id="scx" style="width:100%;margin-top:8px">Zrušit skenování</button></div>
  <button type="button" class="btn" id="lk" style="margin-top:8px;width:100%;display:none">Doplnit název a autora podle ISBN</button>
  <div class="msg" id="lm"></div>
  <label for="f-t">Název</label><input id="f-t" class="field">
  <label for="f-a">Autor</label><input id="f-a" class="field">
  <label for="f-s">Stav</label>
  <select id="f-s" class="field"><option value="chci">Chci číst</option><option value="ctu">Právě čtu</option><option value="precteno">Přečteno</option></select>
  <label>Hodnocení</label><div class="stars" id="stars"></div>
  <label for="f-l">Půjčeno komu (nechte prázdné, pokud je doma)</label><input id="f-l" class="field">
  <label for="f-n">Poznámka</label><textarea id="f-n" class="field"></textarea>
  <div class="msg" id="err" style="color:var(--danger)"></div>
  <div class="row"><button class="btn" id="cx">Zrušit</button><button class="btn d" id="del">Smazat</button><button class="btn p" id="sv">Uložit</button></div>
</div></div>

<div class="shade" id="sh2"><div class="sheet" role="dialog" aria-label="Záloha">
  <h2>Záloha a obnovení</h2>
  <p class="msg">Knihy jsou uložené jen v tomto prohlížeči. Zálohu si zkopírujte a uložte třeba do poznámek. Při obnovení ji vložte do pole níže.</p>
  <textarea id="bt" class="field" style="min-height:150px" aria-label="Záloha"></textarea>
  <div class="msg" id="bm"></div>
  <div class="row"><button class="btn" id="bc">Zkopírovat zálohu</button><button class="btn p" id="br">Obnovit ze zálohy</button></div>
  <div class="row"><button class="btn" id="bx">Zavřít</button></div>
</div></div>

<script>
var K="moje-knihovna-v1",books=[],filter="vse",editId=null,rating=0;
var ST={chci:"Chci číst",ctu:"Právě čtu",precteno:"Přečteno"};
try{books=JSON.parse(localStorage.getItem(K)||"[]");if(!Array.isArray(books))books=[]}catch(e){books=[]}
function save(){try{localStorage.setItem(K,JSON.stringify(books))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function plural(n){return n+(n===1?" kniha":n>=2&&n<=4?" knihy":" knih")}
var FIL=[["vse","Vše"],["chci","Chci číst"],["ctu","Čtu"],["precteno","Přečteno"],["pujceno","Půjčené"]];
function render(){
  var q=$("q").value.trim().toLowerCase();
  $("chips").innerHTML=FIL.map(function(f){return '<button class="chip" data-f="'+f[0]+'" aria-pressed="'+(filter===f[0])+'">'+f[1]+'</button>'}).join("");
  var out=books.filter(function(b){
    if(filter==="pujceno"&&!b.loan)return false;
    if(filter!=="vse"&&filter!=="pujceno"&&b.status!==filter)return false;
    return !q||(b.title+" "+b.author+" "+b.note+" "+(b.isbn||"")).toLowerCase().indexOf(q)>-1;
  }).sort(function(a,b){return a.title.localeCompare(b.title,"cs")});
  $("count").textContent=books.length?plural(books.length)+(out.length!==books.length?" · zobrazeno "+out.length:""):"Zatím tu nic není";
  if(!out.length){$("list").innerHTML='<div class="empty">'+(books.length?"Žádná kniha neodpovídá hledání.":"Přidejte první knihu tlačítkem dole.")+'</div>';return}
  $("list").innerHTML=out.map(function(b){
    var st=b.rating?"★".repeat(b.rating):"";
    return '<button class="book" data-id="'+b.id+'"><span class="spine" style="background:hsl('+hue(b.title)+',38%,40%)"></span><span class="bb"><div class="t">'+esc(b.title)+'</div>'+(b.author?'<div class="a">'+esc(b.author)+'</div>':'')+'<div class="meta"><span>'+ST[b.status]+'</span>'+(st?'<span>'+st+'</span>':'')+(b.loan?'<span class="loan">Půjčeno: '+esc(b.loan)+'</span>':'')+'</div></span></button>';
  }).join("");
}
function drawStars(){
  $("stars").innerHTML=[1,2,3,4,5].map(function(n){return '<button type="button" data-n="'+n+'" class="'+(n<=rating?"on":"")+'" aria-label="'+n+' z 5">★</button>'}).join("");
}
function openEdit(id){
  var b=books.filter(function(x){return x.id===id})[0];editId=b?b.id:null;
  $("ft").textContent=b?"Upravit knihu":"Nová kniha";
  $("f-i").value=b?b.isbn||"":"";$("lm").textContent="";$("f-t").value=b?b.title:"";$("f-a").value=b?b.author:"";$("f-s").value=b?b.status:"chci";
  $("f-l").value=b?b.loan:"";$("f-n").value=b?b.note:"";rating=b?b.rating:0;
  $("del").style.display=b?"":"none";$("err").textContent="";drawStars();
  $("sh1").classList.add("on");$("f-t").focus();
}
function closeAll(){stopScan();$("sh1").classList.remove("on");$("sh2").classList.remove("on")}
$("addb").onclick=function(){openEdit(null)};
$("cx").onclick=closeAll;$("bx").onclick=closeAll;
$("stars").onclick=function(e){var n=e.target.getAttribute("data-n");if(n){n=+n;rating=(rating===n?0:n);drawStars()}};
$("sv").onclick=function(){
  var t=$("f-t").value.trim();
  if(!t){$("err").textContent="Vyplňte název knihy.";return}
  var rec={isbn:$("f-i").value.trim(),title:t,author:$("f-a").value.trim(),status:$("f-s").value,rating:rating,loan:$("f-l").value.trim(),note:$("f-n").value.trim()};
  if(editId){books=books.map(function(b){return b.id===editId?Object.assign({id:editId},rec):b})}
  else{rec.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);books.push(rec)}
  save();closeAll();render();
};
$("del").onclick=function(){
  if(!editId)return;
  if(!confirm("Smazat tuto knihu?"))return;
  books=books.filter(function(b){return b.id!==editId});save();closeAll();render();
};
$("list").onclick=function(e){var el=e.target.closest(".book");if(el)openEdit(el.getAttribute("data-id"))};
$("chips").onclick=function(e){var f=e.target.getAttribute("data-f");if(f){filter=f;render()}};
$("q").oninput=render;
$("bk").onclick=function(){$("bt").value=JSON.stringify(books);$("bm").textContent="";$("sh2").classList.add("on")};
$("bc").onclick=function(){
  var t=$("bt");t.value=JSON.stringify(books);t.focus();t.select();
  try{navigator.clipboard.writeText(t.value).then(function(){$("bm").textContent="Záloha je zkopírovaná."},function(){$("bm").textContent="Text je označený, zkopírujte ho ručně."})}
  catch(e){$("bm").textContent="Text je označený, zkopírujte ho ručně."}
};
$("br").onclick=function(){
  try{
    var d=JSON.parse($("bt").value);
    if(!Array.isArray(d))throw 0;
    d=d.filter(function(b){return b&&typeof b.title==="string"&&b.title}).map(function(b){return{id:String(b.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),isbn:String(b.isbn||""),title:b.title,author:String(b.author||""),status:ST[b.status]?b.status:"chci",rating:Math.min(5,Math.max(0,+b.rating||0)),loan:String(b.loan||""),note:String(b.note||"")}});
    if(!confirm("Nahradit současné knihy zálohou ("+plural(d.length)+")?"))return;
    books=d;save();render();$("bm").textContent="Obnoveno: "+plural(d.length)+".";
  }catch(e){$("bm").textContent="Záloha nemá správný formát."}
};
render();
$("lk").style.display="";
var qr=null;
function stopScan(){
  $("scw").style.display="none";
  if(qr){var q=qr;qr=null;q.stop().then(function(){q.clear()}).catch(function(){})}
}
$("scx").onclick=stopScan;
$("sc").onclick=async function(){
  if(typeof Html5Qrcode==="undefined"){$("lm").textContent="Skener se nenačetl. Zkontrolujte připojení.";return}
  $("scw").style.display="block";$("lm").textContent="";
  qr=new Html5Qrcode("reader");
  try{
    await qr.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8]},
      function(t){stopScan();$("f-i").value=t;$("lk").click()},function(){});
  }catch(e){stopScan();$("lm").textContent="Kameru se nepodařilo spustit. Povolte jí přístup v nastavení Safari."}
};
$("lk").onclick=async function(){
  var i=$("f-i").value.replace(/[^0-9Xx]/g,"");
  if(i.length!==10&&i.length!==13){$("lm").textContent="ISBN má mít 10 nebo 13 číslic.";return}
  $("lm").textContent="Hledám…";
  try{
    var res=await fetch("https://openlibrary.org/api/books?bibkeys=ISBN:"+i+"&format=json&jscmd=data");
    var d=await res.json(),info=d["ISBN:"+i];
    if(info&&info.title){
      $("f-t").value=info.title;
      $("f-a").value=(info.authors||[]).map(function(x){return x.name}).join(", ");
      $("lm").textContent="Doplněno z databáze Open Library."
    }else $("lm").textContent="Kniha nebyla v databázi nalezena. Vyplňte ji ručně."
  }catch(e){$("lm").textContent="Vyhledání se nepovedlo. Zkontrolujte připojení."}
};
</script>
</body>
</html>
